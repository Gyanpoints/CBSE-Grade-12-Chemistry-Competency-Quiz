    { q: "22. Freezing point of $1\\text{ molal}$ $\\text{KCl}$ solution ($K_f = 1.86\\text{ K kg mol}^{-1}$):", options: ["(A) $-3.72^\\circ\\text{C}$", "(B) $+3.72^\\circ\\text{C}$", "(C) $-1.86^\\circ\\text{C}$", "(D) $+2.72^\\circ\\text{C}$"], answer: 0 },
    { q: "23. In Arrhenius equation $k = A e^{-E_a/RT}$, '$A$' represents:", options: ["(A) effective collisions", "(B) frequency factor", "(C) fraction of collisions", "(D) threshold energy"], answer: 1 },
    { q: "24. $\\alpha$-D-glucose and $\\beta$-D-glucose differ with respect to:", options: ["(A) size of ring", "(B) configuration at C2", "(C) number of $-\\text{OH}$ groups", "(D) configuration at C1 carbon"], answer: 3 },

let currentQ = 0;
let userAnswers = new Array(quizData.length).fill(null);

function loadQuestion() {
    const item = quizData[currentQ];
    document.getElementById("quiz-progress").innerText = `Question ${currentQ + 1} of ${quizData.length}`;
    document.getElementById("question-text").innerHTML = item.q;
    
    const container = document.getElementById("options-container");
    container.innerHTML = "";
    
    item.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        if (userAnswers[currentQ] === idx) btn.classList.add("selected");
        btn.innerHTML = opt;
        btn.onclick = () => selectOption(idx);
        container.appendChild(btn);
    });

    document.getElementById("prev-btn").disabled = currentQ === 0;
    if (currentQ === quizData.length - 1) {
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("submit-btn").style.display = "inline-block";
    } else {
        document.getElementById("next-btn").style.display = "inline-block";
        document.getElementById("submit-btn").style.display = "none";
    }

    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([document.getElementById("chem-quiz-container")]);
    }
}

function selectOption(idx) {
    userAnswers[currentQ] = idx;
    loadQuestion();
}

function nextQuestion() {
    if (currentQ < quizData.length - 1) {
        currentQ++;
        loadQuestion();
    }
}

function prevQuestion() {
    if (currentQ > 0) {
        currentQ--;
        loadQuestion();
    }
}

function calculateScore() {
    let score = 0;
    let reviewHtml = "<h3 class='review-header-title'>Detailed Question Review</h3>";

    quizData.forEach((item, idx) => {
        const userChoiceIdx = userAnswers[idx];
        const isCorrect = userChoiceIdx === item.answer;
        if (isCorrect) score++;

        const userChoiceText = userChoiceIdx !== null ? item.options[userChoiceIdx] : "<em>Not Attempted</em>";
        const correctChoiceText = item.options[item.answer];

        reviewHtml += `
            <div class="review-card ${isCorrect ? 'review-pass' : 'review-fail'}">
                <div class="review-q-title">${item.q}</div>
                <div class="review-ans-group">
                    <div class="given-answer ${isCorrect ? 'correct-badge' : 'incorrect-badge'}">
                        <strong>Your Answer:</strong> ${userChoiceText} ${isCorrect ? '✓' : '✗'}
                    </div>
                    ${!isCorrect ? `<div class="correct-answer-text"><strong>Correct Answer:</strong> ${correctChoiceText}</div>` : ''}
                </div>
            </div>
        `;
    });

    document.getElementById("quiz-body").style.display = "none";
    document.getElementById("prev-btn").style.display = "none";
    document.getElementById("submit-btn").style.display = "none";
    document.getElementById("restart-btn").style.display = "inline-block";

    const scoreBoard = document.getElementById("score-board");
    scoreBoard.style.display = "block";
    scoreBoard.innerHTML = `
        <div class="score-summary">
            🎉 Quiz Completed!<br>Your Score: <strong>${score} / ${quizData.length}</strong> (${((score/quizData.length)*100).toFixed(1)}%)
        </div>
        ${reviewHtml}
    `;

    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([scoreBoard]);
    }
}

function restartQuiz() {
    currentQ = 0;
    userAnswers.fill(null);
    document.getElementById("quiz-body").style.display = "block";
    document.getElementById("score-board").style.display = "none";
    document.getElementById("restart-btn").style.display = "none";
    loadQuestion();
}

loadQuestion();
</script>
